<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>글로벌 ETF 자금유출입</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">

  <!-- top bar -->
  <div class="topbar">
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 17l5-5 3 3 7-8" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 7h3v3" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div>
        <h1>글로벌 ETF 자금유출입</h1>
        <p>Global ETF Asset Flow · USD</p>
      </div>
    </div>
    <div class="topbar-right">
      <div class="viewswitch" id="viewSwitch">
        <button data-page="overview" class="on">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="9" rx="1.5" stroke="currentColor" stroke-width="2"/><rect x="14" y="3" width="7" height="5" rx="1.5" stroke="currentColor" stroke-width="2"/><rect x="14" y="12" width="7" height="9" rx="1.5" stroke="currentColor" stroke-width="2"/><rect x="3" y="16" width="7" height="5" rx="1.5" stroke="currentColor" stroke-width="2"/></svg>
          개요
        </button>
        <button data-page="detail">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16M7 12h13M10 18h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="4" cy="12" r="1.4" fill="currentColor"/><circle cx="7" cy="18" r="1.4" fill="currentColor"/></svg>
          세부 분석
        </button>
      </div>
      <span class="pill"><span class="dot"></span>실시간 데모</span>
      <button class="theme-btn" id="themeBtn" aria-label="테마 전환">
        <span class="knob" id="knob">
          <svg id="sun" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19"/></g></svg>
        </span>
      </button>
    </div>
  </div>

  <!-- ===== OVERVIEW PAGE ===== -->
  <div class="page on" id="page-overview">
  <!-- KPI cards -->
  <div class="kpis" id="kpis"></div>

  <!-- toolbar -->
  <div class="toolbar">
    <div class="field">
      <span>국가</span>
      <select id="country">
        <option value="ALL">국가전체</option>
        <option value="US">미국</option>
        <option value="HK">홍콩</option>
        <option value="JP">일본</option>
      </select>
    </div>
    <div class="seg" id="viewSeg">
      <button data-view="flow" class="on">자금유출입</button>
      <button data-view="return">수익률</button>
    </div>
    <div class="seg" id="periodSeg">
      <button data-p="flow_1w">1W</button>
      <button data-p="flow_1m">1M</button>
      <button data-p="flow_3m" class="on">3M</button>
      <button data-p="flow_6m">6M</button>
      <button data-p="flow_ytd">YTD</button>
      <button data-p="flow_1y">1Y</button>
    </div>
    <div class="grow"></div>
    <div class="field">
      <span>단위</span>
      <select id="unitSel">
        <option value="trillion">조 달러</option>
        <option value="billion">십억 달러</option>
        <option value="million" selected>백만 달러</option>
        <option value="thousand">천 달러</option>
      </select>
    </div>
    <button class="btn btn-ghost" id="tmplBtn">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      템플릿
    </button>
    <button class="btn btn-primary" id="uploadBtn">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 21V9m0 0l-4 4m4-4l4 4M5 3h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      CSV 업로드
    </button>
    <input type="file" id="fileInput" class="file-input" accept=".csv">
  </div>

  <!-- chart -->
  <div class="card chart-card">
    <div class="chart-head">
      <div class="chart-title">누적 자금흐름<small id="chartSub">선택 자산군 · 최근 추이</small></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="chart-box" id="chartBox"><div class="tip" id="tip"></div></div>
  </div>

  <!-- table -->
  <div class="card table-card">
    <table>
      <thead>
        <tr>
          <th class="chk"><span class="check" id="checkAll" title="전체 선택/해제"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></th>
          <th>자산군</th>
          <th>순자산 · 비중</th>
          <th>1W</th><th>1M</th><th>3M</th><th>6M</th><th>YTD</th><th>1Y</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="foot">
    <span id="rowNote"></span>
    <span><span id="unitNote" style="color:var(--accent);font-weight:700"></span> &nbsp;·&nbsp; <span id="lastUpdate"></span></span>
  </div>
  </div><!-- /page-overview -->

  <!-- ===== DETAIL PAGE ===== -->
  <div class="page" id="page-detail">
    <!-- detail toolbar -->
    <div class="toolbar">
      <div class="seg" id="axisSeg">
        <button data-axis="asset" class="on">자산별</button>
        <button data-axis="region">지역·국가별</button>
      </div>
      <div class="seg" id="viewSegD">
        <button data-view="flow" class="on">자금유출입</button>
        <button data-view="return">수익률</button>
      </div>
      <div class="seg" id="periodSegD">
        <button data-p="flow_1w">1W</button>
        <button data-p="flow_1m">1M</button>
        <button data-p="flow_3m" class="on">3M</button>
        <button data-p="flow_6m">6M</button>
        <button data-p="flow_ytd">YTD</button>
        <button data-p="flow_1y">1Y</button>
      </div>
      <div class="grow"></div>
      <div class="field">
        <span>단위</span>
        <select id="unitSelD">
          <option value="trillion">조 달러</option>
          <option value="billion">십억 달러</option>
          <option value="million" selected>백만 달러</option>
          <option value="thousand">천 달러</option>
        </select>
      </div>
    </div>
    <div class="cattabs" id="cattabs"></div>
    <div class="card tree-card">
      <table class="tree">
        <thead>
          <tr>
            <th id="treeHeadCol">분류 · 세부항목</th>
            <th>순자산 · 비중</th>
            <th>1W</th><th>1M</th><th>3M</th><th>6M</th><th>YTD</th><th>1Y</th>
          </tr>
        </thead>
        <tbody id="treebody"></tbody>
      </table>
    </div>
    <div class="foot">
      <span id="treeNote"></span>
      <span id="treeHint">세부항목을 클릭하면 상세 추이를 볼 수 있습니다</span>
    </div>
  </div><!-- /page-detail -->
  </div><!-- /wrap -->

  <!-- slide-over detail panel -->
  <div class="scrim" id="scrim"></div>
  <aside class="panel" id="panel">
    <div class="panel-head">
      <button class="panel-close" id="panelClose"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <div class="eyebrow" id="pEyebrow"></div>
      <h2 id="pName"></h2>
      <div class="sub" id="pSub"></div>
    </div>
    <div class="panel-body">
      <div class="stat-grid" id="pStats"></div>
      <div class="panel-sec-title">누적 자금흐름 추이</div>
      <div class="panel-chart" id="pChart"></div>
      <div class="panel-sec-title">기간별 순유입</div>
      <div class="flowbars" id="pFlows"></div>
      <div class="panel-sec-title" style="margin-top:20px">기간별 수익률</div>
      <div class="panel-chart" id="pReturnChart" style="height:150px"></div>
    </div>
  </aside>

  <!-- asset-level slide-over panel (overview) -->
  <aside class="panel wide" id="apanel">
    <div class="panel-head">
      <button class="panel-close" id="apanelClose"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <div class="eyebrow" id="apEyebrow"></div>
      <h2 id="apName"></h2>
      <div class="sub" id="apSub"></div>
    </div>
    <div class="panel-body">
      <div class="stat-grid" id="apStats"></div>
      <div class="panel-sec-title">누적 자금유출입 · 순자산 추이</div>
      <div class="combo-legend">
        <span><i class="bar" style="background:var(--accent)"></i>누적 자금유출입 (좌)</span>
        <span><i style="background:var(--accent-2)"></i>순자산 (우)</span>
      </div>
      <div class="combo-chart" id="apChart"></div>
      <div class="panel-sec-title" style="margin-top:18px">일자별 상세</div>
      <div class="dt-scroll">
        <table class="datetable">
          <thead><tr><th>일자</th><th>순자산</th><th>당일</th><th>누적</th></tr></thead>
          <tbody id="apRows"></tbody>
        </table>
      </div>
    </div>
  </aside>

<script src="data.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
