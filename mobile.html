<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>글로벌 ETF 자금유출입</title>
<link rel="stylesheet" href="mobile.css">
</head>
<body>

<div class="mwrap">

  <!-- 헤더 -->
  <header class="mhead">
    <div class="mbrand">
      <div class="mmark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 17l5-5 3 3 7-8" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 7h3v3" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div>
        <div class="mbrand-title">글로벌 ETF 자금유출입</div>
        <div class="mbrand-sub">Global ETF Asset Flow · USD</div>
      </div>
    </div>
    <div class="mhead-right">
      <span class="mpill"><span class="mpill-dot"></span>데모</span>
      <button class="mtheme-btn" id="mThemeBtn" aria-label="테마 전환">
        <svg id="mThemeIcon" viewBox="0 0 24 24" fill="none" width="18" height="18">
          <circle cx="12" cy="12" r="4.5" fill="currentColor"/>
          <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19"/>
          </g>
        </svg>
      </button>
    </div>
  </header>

  <!-- 개요 페이지 -->
  <div class="mpage on" id="mpage-overview">
    <div class="mctrl-bar">
      <div class="mseg-wrap">
        <div class="mseg" id="mPeriodSeg">
          <button data-p="flow_1w">1W</button>
          <button data-p="flow_1m">1M</button>
          <button data-p="flow_3m" class="on">3M</button>
          <button data-p="flow_6m">6M</button>
          <button data-p="flow_ytd">YTD</button>
          <button data-p="flow_1y">1Y</button>
        </div>
      </div>
      <select id="mUnitSel" class="mselect">
        <option value="trillion">조 달러</option>
        <option value="billion">십억 달러</option>
        <option value="million" selected>백만 달러</option>
        <option value="thousand">천 달러</option>
      </select>
    </div>
    <div id="mKpis" class="mkpis"></div>
    <div class="msec-title">자산별 자금유출입</div>
    <div id="mAssetList" class="mcard-list"></div>
    <div class="mfoot">단위 <span id="mUnitNote" class="mfoot-accent"></span> &nbsp;·&nbsp; 최종 업데이트 2026-06-24</div>
  </div>

  <!-- 세부 분석 페이지 -->
  <div class="mpage" id="mpage-detail">
    <div class="mctrl-bar">
      <div class="mseg maxis-seg" id="mAxisSeg">
        <button data-axis="asset" class="on">자산별</button>
        <button data-axis="region">지역·국가별</button>
      </div>
      <select id="mUnitSelD" class="mselect">
        <option value="trillion">조 달러</option>
        <option value="billion">십억 달러</option>
        <option value="million" selected>백만 달러</option>
        <option value="thousand">천 달러</option>
      </select>
    </div>
    <div class="mcattabs-wrap">
      <div id="mCattabs" class="mcattabs"></div>
    </div>
    <div id="mLeafList" class="mcard-list"></div>
    <div class="mfoot">세부항목을 탭하면 상세 내용을 확인할 수 있습니다.</div>
  </div>

  <!-- 바텀 네비 -->
  <nav class="mnav">
    <button class="on" data-page="overview">
      <svg viewBox="0 0 24 24" fill="none" width="20" height="20">
        <rect x="3" y="3" width="7" height="9" rx="1.5" stroke="currentColor" stroke-width="1.8"/>
        <rect x="14" y="3" width="7" height="5" rx="1.5" stroke="currentColor" stroke-width="1.8"/>
        <rect x="14" y="12" width="7" height="9" rx="1.5" stroke="currentColor" stroke-width="1.8"/>
        <rect x="3" y="16" width="7" height="5" rx="1.5" stroke="currentColor" stroke-width="1.8"/>
      </svg>
      <span>개요</span>
    </button>
    <button data-page="detail">
      <svg viewBox="0 0 24 24" fill="none" width="20" height="20">
        <path d="M4 6h16M7 12h13M10 18h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="4" cy="12" r="1.3" fill="currentColor"/>
        <circle cx="7" cy="18" r="1.3" fill="currentColor"/>
      </svg>
      <span>세부분석</span>
    </button>
  </nav>

</div><!-- /mwrap -->

<!-- 전체화면 패널 -->
<div class="mpanel" id="mpanel">
  <div class="mpanel-head">
    <button class="mpanel-back" id="mpanelBack">
      <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M19 12H5m0 0l6-6m-6 6l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      뒤로
    </button>
    <div>
      <div class="eyebrow" id="mpEyebrow"></div>
      <h2 id="mpName"></h2>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-top:4px">
      <select id="mpUnitSel" class="mselect">
        <option value="trillion">조 달러</option>
        <option value="billion">십억 달러</option>
        <option value="million" selected>백만 달러</option>
        <option value="thousand">천 달러</option>
      </select>
    </div>
  </div>
  <div class="mpanel-body">
    <div class="mstat-grid" id="mpStats"></div>
    <div class="mpanel-row" style="margin-bottom:0">
      <div class="mpanel-sec" style="margin:0">누적 자금유출입 · 순자산 추이</div>
      <select id="mpPeriodSel" class="mselect mselect-sm">
        <option value="flow_1w">1W</option>
        <option value="flow_1m" selected>1M</option>
        <option value="flow_3m">3M</option>
        <option value="flow_6m">6M</option>
        <option value="flow_ytd">YTD</option>
        <option value="flow_1y">1Y</option>
      </select>
    </div>
    <div class="combo-legend" style="margin-top:6px">
      <span><i class="bar" style="background:var(--accent)"></i>누적 자금유출입 (좌)</span>
      <span><i style="background:var(--accent-2)"></i>순자산 (우)</span>
    </div>
    <div class="combo-chart" id="mpChart"></div>
    <div class="mpanel-sec" style="margin-top:16px">일자별 상세</div>
    <div class="dt-scroll">
      <table class="datetable">
        <thead><tr><th>일자</th><th>순자산</th><th>당일</th><th>누적</th></tr></thead>
        <tbody id="mpRows"></tbody>
      </table>
    </div>
    <div class="mpanel-sec" style="margin-top:18px">기간별 수익률</div>
    <div id="mpReturnChart" style="height:140px"></div>
    <div class="mpanel-sec" style="margin-top:18px">누적 자금유출입 상위 종목</div>
    <div id="mpTopFlows"></div>
    <div style="height:24px"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="charts.js"></script>
<script src="mobile.js"></script>
</body>
</html>
